# The batch task of the web suite (web-batch.sh).
platform: linux
image_resource:
  type: registry-image
  source: {repository: golang, tag: 1.25.7-bookworm}
inputs:
  - name: source
  - name: batches
  - name: tools
outputs:
  - name: result
caches:
  - path: cache
run:
  path: bash
  args: [source/ci/pipelinegen/web-batch.sh]
