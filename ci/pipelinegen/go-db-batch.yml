# The batch task of the go-db suite: the same script as go-batch.yml, with
# a Docker daemon of its own, because these tests start PostgreSQL through
# testcontainers. The suite runs privileged for that daemon.
platform: linux
image_resource:
  type: registry-image
  source: {repository: golang, tag: 1.25.7-bookworm}
inputs:
  - name: source
  - name: batches
  - name: tools
outputs:
  - name: result
  - name: coverage
caches:
  - path: cache
params:
  GAVEL_DOCKER: "true"
run:
  path: bash
  args:
    - -euc
    - |
      apt-get update -qq && apt-get install -y -qq docker.io >/dev/null
      exec bash source/ci/pipelinegen/go-batch.sh
