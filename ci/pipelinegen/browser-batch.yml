# The batch task of the browser suite (browser-batch.sh). Playwright's own
# image brings Node and the browsers; the task adds Docker (for PostgreSQL),
# and Go (to build the server with coverage). Privileged, for dockerd.
platform: linux
image_resource:
  type: registry-image
  source: {repository: mcr.microsoft.com/playwright, tag: v1.60.0-noble}
inputs:
  - name: source
  - name: batches
  - name: tools
outputs:
  - name: result
  - name: coverage
caches:
  - path: cache
params:
  GO_VERSION: "1.25.7"
  REACT_FIXTURE_VERSION: v0.1.4-rc.5
  REACT_FIXTURE_SHA256: 6b70734e23f575fb00b6024f4ff5edcf0f35bb53c13fe2c315a08c66ad295504
run:
  path: bash
  args:
    - -euc
    - |
      # on CI the image lacks Docker and Go; a machine running `pipelinegen
      # record` has its own and keeps them
      if ! command -v docker >/dev/null; then
        apt-get update -qq && apt-get install -y -qq docker.io curl >/dev/null
        dockerd >dockerd.log 2>&1 &
        for _ in $(seq 60); do docker info >/dev/null 2>&1 && break; sleep 1; done
      fi
      if ! command -v go >/dev/null; then
        curl -fsSL "https://go.dev/dl/go$GO_VERSION.linux-amd64.tar.gz" | tar -C /usr/local -xz
        export PATH=/usr/local/go/bin:$PATH
      fi
      exec bash source/ci/pipelinegen/browser-batch.sh
