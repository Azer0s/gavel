pipeline: gavel

bazel:
  workspace: .
  bazelisk: bazelisk

# --- GitHub: where runs report (statuses, the pull request comment) and
# where the run state lives (hidden refs of this repository).
github:
  repository: Azer0s/gavel
  # the names of Concourse vars, never the tokens. A step gets only the
  # token of what it does: read fetches the code and the releases of
  # pipelinegen and its plugins, and is the only one a task running a
  # change's own scripts may hold; the others write statuses, the comment
  # and the records, on this repository only
  token: github_token
  tokens: {read: github_read_token, changes: github_token, report: github_token, store: github_token}

# --- Concourse: what the generated pipeline needs. The web address is left
# out on purpose: whoever generates the pipeline gives it in
# PIPELINEGEN_CONCOURSE_URL, so no host name lands in this public file.
concourse:
  team: sideways-works
  branch: pipelinegen            # this fork's default branch for the tool; yours is main
  repository:
    uri: https://github.com/Azer0s/gavel.git
    username: x-access-token
    password: ((github_token))
  planner:
    image: {repository: golang, tag: 1.27.1}
    digest: sha256:162be5298a40ed317005c8339c6de4d10d3eef336d66dc8e9259b03ab9d3a6d2
    # The TypeScript and React plugins are Node programs, and this image
    # has no Node: fetch a pinned one (kept in the plan cache, so once per
    # worker), check it, and put it on the default PATH for the plan step.
    # Then fill the module cache: the Go plugins read it and never download.
    prepare: >-
      v=v24.22.3; f="$npm_config_cache/../node-$v-linux-x64.tar.gz";
      [ -f "$f" ] || curl -fsSLo "$f" "https://nodejs.org/dist/$v/node-$v-linux-x64.tar.gz";
      echo "061ec3e3062115705b56b51fa9cc330ab50d34b6969387d4e4b1a50c6809acc2  $f" | sha256sum -c - &&
      tar -xzf "$f" -C /usr/local --strip-components=1 --no-same-owner "node-$v-linux-x64/bin/node" &&
      go mod download && (cd tools && go mod download)
    bootstrap:
      release: {version: v0.1.13-rc.18, sha256: 1dcacdb41949c3a032966f0221f384c04ed854f2398c8a8771d0e8e830598c56}
      bazelisk: {version: v1.30.0, sha256: a248ae2b2b62b5baebb748f6fba7203bff1a27e5d01b55399a8406744cb539e8}

plugins:
  # What exists: every Go declaration and module, with a digest that
  # ignores comments and formatting.
  - name: go-sbom
    kind: sbom
    repository: sideways-works/pipelinegen-sbom-go
    release: {version: v0.1.3-rc.5, sha256: 2c07e4419733085fbc90e1fc080e940e2d6eca99c02d0d6e7ace422f9ebf7327}
    exclude: ["examples/**"]
  # Who uses what: links between declarations, and which declarations each
  # test file ran, read from the coverage the batch leaves.
  - name: go-correlator
    kind: correlator
    repository: sideways-works/pipelinegen-correlator-go
    release: {version: v0.1.8-rc.12, sha256: 9850db46545444bd5d4c84631c29d0481c404cf1bfd51d7401ad8cadb0b27337}
    exclude: ["examples/**"]
  # TypeScript: what exists in the web app and the specs (functions,
  # components, module init) and who ran it, from the browser's and the
  # test runner's coverage, read through the bundle's source map.
  - name: ts
    kind: sbom
    repository: sideways-works/pipelinegen-sbom-ts
    release: {version: v0.1.3-rc.2, sha256: 78f4abbf2c529e6b8d335df2300590630e1c397e4c9610fd29addb4317e74c27}
    exclude: ["examples/**", "docs/**"]
  - name: react
    kind: correlator
    repository: sideways-works/pipelinegen-correlator-react
    release: {version: v0.1.4-rc.14, sha256: 35f6262315e76b91ceb28f19c11d7f065c8aee7e7a3a5eb4ef91f412794bb8b3}
    exclude: ["examples/**", "docs/**"]
    config:
      # gavel has no Vite config to read the build from: the browser batch
      # builds the bundle into apps/web/dist, and the server serves it at /
      bundles:
        - {dist: apps/web/dist, base: /, html: apps/web/index.html, public: apps/web/public}
  # The web app's npm packages, read from its pnpm lockfile: the units the
  # TypeScript correlator links code to when it imports a package.
  - name: npm
    kind: sbom
    repository: sideways-works/pipelinegen-sbom-npm
    release: {version: v0.1.2-rc.2, sha256: 63fd411fd3d6e48ad362f781209c51545c28ad18896b81f2ccf15f45b1e11cd0}
    exclude: ["examples/**"]
  # The API contract: each operation of openapi/v1 a unit, and which Go code
  # serves it (oapi-codegen's generated wrapper and gavel's handler), and
  # which operations each browser spec requested.
  - name: openapi
    kind: sbom
    repository: sideways-works/pipelinegen-sbom-openapi
    release: {version: v0.1.2-rc.4, sha256: c9854ead7c4d78985fff1f2dc4e55a8148bb9d8f284c828060da849b7688a737}
    exclude: ["examples/**", "docs/**", ".github/**"]
  - name: api-uses
    kind: correlator
    repository: sideways-works/pipelinegen-correlator-oapi-codegen
    release: {version: v0.1.5-rc.2, sha256: ad95aa58e261ebdd18711cf9d1ad4c7f439bda4ca746761efdfe6e27a4aa1bbe}
    exclude: ["examples/**"]
    config:
      documents:
        # generated by `make openapi-gen`, which leaves no go:generate line
        - path: openapi/v1/openapi.yaml
          go: {package: core/userinterface/api/v1/gen, strict: true}
  # Writes the Concourse pipeline from this file.
  - name: concourse
    kind: runner
    repository: sideways-works/pipelinegen-runner-concourse
    release: {version: v0.1.9-rc.10, sha256: bf8c8063ffafdaffaf1773db9fe19b9a85851a5bfff470053b97a871d9cf2ba2}
    config:
      placement:
        # every step of this pipeline, the resources' checks included, on
        # the workers tagged cloud-2
        default: [cloud-2]

suites:
  # Go tests that need nothing but Bazel: one slice per _test.go file.
  go:
    tests: ["**/*_test.go"]
    exclude:
      - "examples/**"
      - "apps/cli/test/e2e/*_test.go"
      - "apps/server/test/e2e/**"
      # the database tests are the go-db suite
      - "core/infrastructure/*/postgres/*_test.go"
      - "core/infrastructure/platform/database/*_test.go"
      - "core/infrastructure/platform/sourceblob/*_test.go"
      - "core/infrastructure/supporting/search/*_test.go"
      - "apps/cli/test/integration/submit/*_test.go"
    bind: recorded
    # only Go code runs in these tests: the TypeScript and API correlators
    # have nothing to see here, and their "can't tell" would bind every slice
    correlators: [go-correlator]
    run_slice: ci/pipelinegen/go-batch.yml

  # Go tests of packages whose tests start PostgreSQL through testcontainers:
  # their batches start a Docker daemon of their own.
  go-db:
    tests: ["core/infrastructure/*/postgres/*_test.go", "core/infrastructure/platform/database/*_test.go", "core/infrastructure/platform/sourceblob/*_test.go", "core/infrastructure/supporting/search/*_test.go", "apps/cli/test/integration/submit/*_test.go"]
    bind: recorded
    correlators: [go-correlator]
    privileged: true
    run_slice: ci/pipelinegen/go-db-batch.yml

  # The web app's type check and lint, each a tagged filegroup in
  # apps/web/BUILD.bazel that names the test target running it.
  web:
    tag: slice-web
    run_slice: ci/pipelinegen/web-batch.yml

  # gavel's Playwright specs against the real server and PostgreSQL. Bound
  # by recording: the server's Go coverage, the browser's coverage and the
  # API requests of each spec file.
  browser:
    tests: ["apps/web/e2e/*.ts"]
    helpers: ["apps/web/e2e/fixtures.ts", "apps/web/e2e/recording.ts", "apps/web/e2e/global-setup.ts", "apps/web/e2e/global-teardown.ts"]
    # no Bazel target holds the specs: their owner is a filegroup whose data
    # is what every spec shares. A recorded suite takes only its owner's data
    # from the graph; the code the specs ran comes from the recordings
    owner: "//apps/web:e2e_shared"
    bind: recorded
    # a change to how Playwright runs breaks every spec alike: a few tell
    sample_on: [apps/web/playwright.config.ts, apps/web/playwright.pipelinegen.config.ts]
    privileged: true
    # a recording batch fetches react-correlator's Playwright fixture from
    # the plugin's release, which takes a token that can read it
    secrets: {batch: {GITHUB_TOKEN: github_read_token}}
    run_slice: ci/pipelinegen/browser-batch.yml

  # The web app's unit tests (vitest), bound by the Bazel graph: they sit in
  # the app's sources, so a change to the app runs them.
  vitest:
    tests: ["apps/web/src/**/*.test.ts", "apps/web/src/**/*.test.tsx"]
    owner: "//apps/web:web"
    # how vitest runs breaks every test file alike: a few tell
    sample_on: [apps/web/vitest.config.ts]
    run_slice: ci/pipelinegen/vitest-batch.yml

runs:
  # Ready pull requests into the default branch: the change merged into its
  # tip, compared with that tip. Only the test files it reaches run.
  pr:
    trigger:
      pull_requests: {base: pipelinegen, draft: false}
    compare: merged_target
    select: affected
    suites: {go: {}, go-db: {}, web: {}, browser: {}, vitest: {}}
    record: true
    report:
      comment: {format: mermaid}
      reasoning: true

  # Every commit on the default branch, compared with the last one whose run
  # passed. Its recordings become the lists the next plans read.
  main:
    trigger: {branch: pipelinegen}
    compare: last_passed
    select: affected
    suites: {go: {}, go-db: {}, web: {}, browser: {}, vitest: {}}
    record: true

  # Once a night, everything: the net under every narrowing.
  nightly:
    trigger:
      timer: {start: "3:00", stop: "4:00"}
      branch: pipelinegen
    compare: none
    select: all
    suites: {go: {}, go-db: {}, web: {}, browser: {}, vitest: {}}
    record: true

# The web app's BUILD file calls web_project, a macro from gavel's own
# module registry (gavel_tools), which globs the app's files itself. The
# check can't see inside another repository's macro, so it is told here.
macros:
  "@gavel_tools//macros:web.bzl%web_project":
    reads: ["src/**/*.ts", "src/**/*.tsx", "src/**/*.css", "public/**", index.html, "tsconfig*.json", eslint.config.js, tailwind.config.js]
    reason: bundles, styles, type-checks and lints the app's sources

# go.mod, go.sum, go.work and tools/go.* are not here: go-sbom claims them
# and lists each module as a unit, so a bump runs the slices whose code
# links the bumped module, and the graph-bound suites through Bazel's
# go_deps.
everything_on:
  - pipelinegen.yaml
  - MODULE.bazel
  - .bazelversion
  - .bazelrc
  - .bazelignore
  - tools/BUILD.bazel
  # the web app's npm packages: Bazel installs them from this lockfile for
  # the app, the vitest files and the browser specs alike
  - apps/web/package.json
  - apps/web/pnpm-lock.yaml
  - "ci/pipelinegen/**"

untested:
  - paths: ["examples/**"]
    reason: separate Bazel workspaces (in .bazelignore) that gavel's onboarding job judges; no test of this workspace reads them
  - paths: ["docs/**", "**/*.md", LICENSE, glama.json]
    reason: prose and listings, read by people only
  - paths: [".github/**", .gitignore, codecov.yml]
    reason: repository settings and the old CI
  - paths: [".gavel/**", .golangci.yml]
    reason: gavel's own quality baseline and lint settings, read when gavel judges itself
  - paths: [.goreleaser.yaml, hack/release.sh, install.sh, Makefile]
    reason: release and developer scripts, run by people
  - paths: [apps/web/.gitignore]
    reason: repository settings
  - paths: ["apps/web/src/assets/**"]
    reason: images in the source tree that nothing imports and the build doesn't take
  - paths: [apps/web/scripts/generate-tokens.mjs, apps/web/tokens.json]
    reason: the design tokens and the script a person runs to turn them into the checked-in styles
  - paths: ["apps/cli/test/e2e/*_test.go", "apps/server/test/e2e/*_test.go", apps/cli/test/e2e/run.sh, apps/server/test/e2e/run.sh]
    reason: end-to-end tests behind the build tag e2e; they do not build at this commit
  - paths: [apps/server/test/e2e/devdemo.sh, "apps/server/testdata/**"]
    reason: a script and sample data for running a demo by hand
  - paths: [apps/server/cmd/gavel-server/BUILD.bazel, apps/server/internal/platform/frontend/BUILD.bazel]
    reason: the server's Bazel build, which no test runs; the browser suite builds the server with go build
  - paths: [apps/cli/BUILD.bazel, apps/cli/test/e2e/BUILD.bazel, apps/server/test/e2e/BUILD.bazel, core/domain/iam/model/BUILD.bazel, core/userinterface/api/v1/server/supporting/BUILD.bazel]
    reason: BUILD files that declare no target
  - paths: [core/userinterface/api/v1/gen/oapi-codegen.yaml]
    reason: the generator's settings; what it generates is checked in and tested
